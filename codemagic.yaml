workflows:
  mini-claude-android:
    name: Mini Claude Offline AI - Android APK
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Prepare Android SDK and NDK
        script: |
          echo "Android SDK: $ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Download llama.cpp Android engine
        script: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git engine-src
      - name: Configure Mini Claude for Android 10+
        script: |
          cd engine-src/examples/llama.android
          sed -i '' 's/minSdk = 33/minSdk = 29/g' app/build.gradle.kts lib/build.gradle.kts
          sed -i '' 's/applicationId = "com.example.llama.aichat"/applicationId = "com.aboalhosin.miniclaude"/' app/build.gradle.kts
          sed -i '' 's/rootProject.name = "AiChat"/rootProject.name = "MiniClaudeOffline"/' settings.gradle.kts
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build debug APK
        script: |
          cd engine-src/examples/llama.android
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
    artifacts:
      - engine-src/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk
