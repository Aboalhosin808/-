name: Build Mini Claude APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Get llama.cpp Android engine
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git engine-src
          mkdir -p build-project
          cp -a engine-src/examples/llama.android/. build-project/
          cp -a engine-src/. build-project/llama.cpp/

      - name: Configure for Android 10+
        working-directory: build-project
        run: |
          sed -i 's/minSdk = 33/minSdk = 29/g' app/build.gradle.kts lib/build.gradle.kts
          sed -i 's/applicationId = "com.example.llama.aichat"/applicationId = "com.aboalhosin.miniclaude"/' app/build.gradle.kts
          sed -i 's/rootProject.name = "AiChat"/rootProject.name = "MiniClaudeOffline"/' settings.gradle.kts

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: build-project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Claude-Offline-APK
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
